help:
  header: "<prefix><yellow>PartySystem <gray>kommandoer:"
  player:
    - "<yellow>/party kit <gray>- Se alle kits"
    - "<yellow>/party kit <navn> <gray>- Vælg et kit (lederen giver det til hele partyet)"
    - "<yellow>/party menu <gray>- Åbn match-menuen (eller brug sworden fra /party create)"
    - "<yellow>/party start [kit] <gray>- Start et match med menuens indstillinger"
    - "<yellow>/party edit <gray>- Byg eller rediger dit eget kit"
    - "<yellow>/party save <gray>- Gem dit eget kit"
    - "<yellow>/party restock <gray>- Få dit kit igen (har cooldown)"
    - "<yellow>/party status <gray>- Se din status og restock-cooldown"
    - "<yellow>/party leave <gray>- Forlad arenaen eller dit party (ikke lederen)"
    - "<yellow>/party create <gray>- Opret dit eget party"
    - "<yellow>/party invite <spiller> <gray>- Inviter en spiller til dit party"
    - "<yellow>/party accept <gray>/ <yellow>deny <gray>- Svar på en invitation"
    - "<yellow>/party list <gray>- Se medlemmer i dit party"
    - "<yellow>/party remove <spiller> <gray>- Fjern en spiller (leder)"
    - "<yellow>/party disband <gray>- Opløs dit party (kun lederen)"
  admin:
    - "<gold>/party editkit <kit> <gray>- Rediger et kit (nyt navn = nyt kit)"
    - "<gold>/party savekit <gray>/ <gold>cancelkit <gray>- Gem eller afbryd redigering"
    - "<gold>/party setspawn [arena] <gray>- Sæt spawn for en arena (nyt navn = ny arena)"
    - "<gold>/party setpos1 / setpos2 [arena] <gray>- Sæt arenaens område"
    - "<gold>/party delspawn <arena> <gray>- Slet en arena"
    - "<gold>/party arenas <gray>- Vis alle arenaer"
    - "<gold>/party arenakit <arena> <add|remove|clear> [kit] <gray>- Begræns en arena til bestemte gamemodes"
    - "<gold>/party open / close <gray>- Åbn eller luk party"
    - "<gold>/party reload <gray>- Genindlæs konfiguration"
    - "<gold>/party resetkit <spiller> <gray>- Nulstil kit"
    - "<gold>/party resetcooldown <spiller> <gray>- Nulstil restock-cooldown"
    - "<gold>/party kick <spiller> <gray>- Fjern spiller fra party"
    - "<gold>/party info <spiller> <gray>- Vis spillerdata"

