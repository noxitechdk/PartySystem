# Kit til /party kit pot
# Filnavnet (uden .yml) er kittets navn i kommandoen. Rediger frit - brug /party reload bagefter.
#
# slot: 0-8 = hotbar, 9-35 = inventory, eller helmet / chestplate / leggings / boots / offhand
# material: Minecraft-material. fallback (valgfri) bruges hvis materialet ikke findes på serveren.
# icon (valgfri): materiale der vises i /party menu. Uden icon bruges kittets første item.
# amount, name og lore (MiniMessage), enchantments (navn: niveau), potion (fx strong_healing), unbreakable
display-name: "<red>Pot"
icon: SPLASH_POTION
